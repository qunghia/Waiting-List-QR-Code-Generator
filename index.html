<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Waiting Number</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .ticket {
            width: 90%;
            max-width: 500px;
            padding: 50px 30px;
            text-align: center;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        #number {
            font-size: 140px;
            font-weight: bold;
            margin: 20px 0;
        }

        p {
            font-size: 18px;
            color: #555;
        }
    </style>
</head>

<body>

    <div class="ticket">

        <h1>WAITING NUMBER</h1>

        <div id="number">---</div>

        <p>Please wait for your number to be called.</p>

    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const number = parseInt(params.get("number"));

        if (number >= 1 && number <= 500) {
            document.getElementById("number").textContent = number;
        } else {
            document.getElementById("number").textContent = "Invalid";
        }
    </script>

</body>
</html>
